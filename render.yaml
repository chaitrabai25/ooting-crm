services:
  - type: web
    name: ooting-crm
    env: node
    runtime: node
    region: singapore # or oregon / frankfurt
    plan: starter
    buildCommand: npm install && npm run prisma:pg:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ooting-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ooting-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COMPANY_NAME
        value: Ooting
      - key: COMPANY_TAGLINE
        value: Journeys Beyond Ordinary
      - key: COMPANY_EMAIL
        value: contact@ooting.com
      - key: COMPANY_PHONE
        value: "+91 98765 43210"
      - key: COMPANY_ADDRESS
        value: "Ooting Holidays Private Limited, Bangalore, Karnataka, India"
      - key: COMPANY_GSTIN
        value: "29AABCO1234F1Z5"

databases:
  - name: ooting-crm-db
    databaseName: ooting_crm
    user: ooting_admin
    region: singapore
    plan: starter
